name: Container checks and images
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  verify:
    name: Container integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: node --test infrastructure/tests/deploy.test.mjs
      - run: npm ci
        working-directory: apps/web
      - name: Check frontend before manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: npm run lint && npm run typecheck
        working-directory: apps/web
      - run: docker compose -f infrastructure/compose.test.yaml build
      - name: Build PHPUnit runner before manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: docker compose -f infrastructure/compose.test.yaml --profile tools build phpunit
      - run: docker compose -f infrastructure/compose.test.yaml up -d --wait postgres
      - run: docker compose -f infrastructure/compose.test.yaml run --rm api php artisan migrate --force --no-interaction
      - name: Run PHPUnit before manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: docker compose -f infrastructure/compose.test.yaml run --rm phpunit
      - run: docker compose -f infrastructure/compose.test.yaml up -d --wait
      - run: |
          test "$(docker compose -f infrastructure/compose.test.yaml exec -T api id -u)" = 10001
          test "$(docker compose -f infrastructure/compose.test.yaml exec -T web id -u)" = 10001
          curl --fail http://localhost:8011/ready
          curl --fail http://localhost:3011/health
      - run: node infrastructure/tests/container-smoke.mjs
      - run: sh infrastructure/tests/shutdown.sh
      - run: |
          mkdir -p apps/web/tests/.runtime/{assets,private,sessions}
          chmod -R 777 apps/web/tests/.runtime
          docker compose -f infrastructure/compose.test.yaml -f infrastructure/compose.e2e.yaml up -d --wait api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          E2E_EXTERNAL_SERVERS: '1'
          E2E_PHP_CONTAINER: nought-integration-api-1
      - name: Export exact tested images for manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: docker save nought-api:local nought-web:local -o /tmp/tested-images.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          name: tested-images
          path: /tmp/tested-images.tar
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
      - if: always()
        run: docker compose -f infrastructure/compose.test.yaml down -v
  publish:
    name: Publish tested images (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-images
          path: /tmp/images
      - run: docker load -i /tmp/images/tested-images.tar
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested images
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          repository=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          for component in api web; do
            image="ghcr.io/$repository-$component:$REVISION"
            docker tag "nought-$component:local" "$image"
            docker push "$image"
            docker inspect --format '{{join .RepoDigests "\n"}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          done
