services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nought_one
      POSTGRES_USER: nought
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U nought -d nought_one
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
