services:
  api:
    build:
      context: ../apps/api
      target: development
      args: &dev-user
        DEV_UID: ${LOCAL_UID:-1000}
        DEV_GID: ${LOCAL_GID:-1000}
    env_file: ../apps/api/.env
    environment: &backend
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      FORCE_PUBLIC_URL: "true"
      DB_CONNECTION: pgsql
      DB_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nought_one
      DB_USERNAME: nought
      DB_PASSWORD: local_dev_password
      SESSION_DRIVER: database
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "false"
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      CARD_ASSETS_DISK: card_assets
      MAIL_MAILER: log
    ports: ["127.0.0.1:8000:8080"]
    volumes: &backend-volumes
      - ../apps/api:/app
      - api_vendor:/app/vendor
      - ./php.dev.ini:/usr/local/etc/php/conf.d/zz-development.ini:ro
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 90s
  worker:
    build: { context: ../apps/api, target: development, args: *dev-user }
    command: [worker]
    env_file: ../apps/api/.env
    environment:
      <<: *backend
      CONTAINER_ROLE: worker
    volumes: *backend-volumes
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 90s
  scheduler:
    build: { context: ../apps/api, target: development, args: *dev-user }
    command: [scheduler]
    env_file: ../apps/api/.env
    environment:
      <<: *backend
      CONTAINER_ROLE: scheduler
    volumes: *backend-volumes
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 90s
  web:
    build: { context: ../apps/web, target: development, args: *dev-user }
    environment:
      API_BASE_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8080
      PUBLIC_SITE_URL: http://localhost:3000
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on: [api]
    stop_grace_period: 30s
volumes:
  api_vendor:
  web_node_modules:
  web_next:
